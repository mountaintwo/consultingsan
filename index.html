            { univ: "강원대(춘천)", g_name: "농어촌", g_change: "127→126", g_count: "126", g_diff: "-1", j_name: "기회균형(농)", j_change: "110→108", j_count: "108", j_diff: "-2", s_name: "", s_change: "", s_count: "", s_diff: "", note: "[교과]정성평가10%" },
            { univ: "강원대(삼척)", g_name: "농어촌", g_change: "52→53", g_count: "53", g_diff: "1", j_name: "기회균형(농)", j_change: "62→61", j_count: "61", j_diff: "-1", s_name: "", s_change: "", s_count: "", s_diff: "", note: "[교과]정성평가10%" },
            { univ: "충남대", g_name: "고른기회(농)", g_change: "46→56", g_count: "56", g_diff: "10", j_name: "농어촌학생", j_change: "111→112", j_count: "113", j_diff: "2", s_name: "", s_change: "", s_count: "", s_diff: "", note: "" },
            { univ: "충북대", g_name: "", g_change: "", g_count: "", g_diff: "", j_name: "농어촌학생", j_change: "120→116", j_count: "116", j_diff: "-4", s_name: "", s_change: "", s_count: "", s_diff: "", note: "" },
            { univ: "공주대", g_name: "농어촌학생", g_change: "0→97", g_count: "97", g_diff: "97", j_name: "농어촌학생", j_change: "99→0", j_count: "0", j_diff: "-99", s_name: "", s_change: "", s_count: "", s_diff: "", note: "[종합]에서 [교과]로 변경" },
            { univ: "경북대", g_name: "사회통합(농)", g_change: "117→189", g_count: "189", g_diff: "72", j_name: "농어촌학생", j_change: "197→192", j_count: "192", j_diff: "-5", s_name: "", s_change: "", s_count: "", s_diff: "", note: "[교과] 교과이수충실도20%" },
            { univ: "전남대", g_name: "농어촌", g_change: "175→173", g_count: "173", g_diff: "-2", j_name: "", j_change: "", j_count: "", j_diff: "", s_name: "", s_change: "", s_count: "", s_diff: "", note: "" },
            { univ: "전북대", g_name: "농어촌학생", g_change: "62→62", g_count: "62", g_diff: "0", j_name: "농어촌학생", j_change: "121→121", j_count: "121", j_diff: "0", s_name: "", s_change: "", s_count: "", s_diff: "", note: "" }
        ];

        const SearchIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const TrendingUpIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 text-emerald-500 mr-1 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
            </svg>
        );

        const TrendingDownIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 text-rose-500 mr-1 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 17h8m0 0v-8m0 8l-8-8-4 4-6-6" />
            </svg>
        );

        const InfoIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 text-blue-500 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const StatBadge = ({ diff }) => {
            if (!diff || diff === "" || diff === "0") return <span className="text-gray-500 text-sm font-medium">변동없음</span>;
            const num = parseInt(diff, 10);
            if (num > 0) {
                return <span className="flex items-center text-emerald-600 font-bold text-sm bg-emerald-50 px-2 py-0.5 rounded-full"><TrendingUpIcon /> +{num}</span>;
            } else {
                return <span className="flex items-center text-rose-600 font-bold text-sm bg-rose-50 px-2 py-0.5 rounded-full"><TrendingDownIcon /> {num}</span>;
            }
        };

        const SectionBox = ({ title, name, change, count, diff }) => {
            if (!name) return null;
            return (
                <div className="bg-white border border-gray-100 p-4 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                    <div className="flex justify-between items-center mb-3 border-b border-gray-100 pb-2">
                        <span className="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded-md">{title}</span>
                        <StatBadge diff={diff} />
                    </div>
                    <div className="mb-2 text-sm font-bold text-gray-800 break-keep">{name}</div>
                    <div className="flex justify-between items-end mt-4">
                        <div className="text-xs text-gray-500">
                            <p className="mb-1">인원 변화</p>
                            <p className="font-mono bg-gray-50 px-1 py-0.5 rounded text-gray-600">{change}</p>
                        </div>
                        <div className="text-right">
                            <p className="text-xs text-gray-500 mb-0.5">올해 인원</p>
                            <p className="text-lg font-black text-gray-900">{count}<span className="text-xs font-normal text-gray-500 ml-1">명</span></p>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterType, setFilterType] = React.useState('all'); // all, g, j, s

            const filteredData = React.useMemo(() => {
                return rawData.filter(item => {
                    const matchesSearch = item.univ.includes(searchTerm);
                    let matchesFilter = true;
                    
                    if (filterType === 'g') matchesFilter = item.g_name !== "";
                    if (filterType === 'j') matchesFilter = item.j_name !== "";
                    if (filterType === 's') matchesFilter = item.s_name !== "";

                    return matchesSearch && matchesFilter;
                });
            }, [searchTerm, filterType]);

            // Summary stats
            const totalG = rawData.reduce((acc, curr) => acc + (parseInt(curr.g_count) || 0), 0);
            const totalJ = rawData.reduce((acc, curr) => acc + (parseInt(curr.j_count) || 0), 0);
            const totalS = rawData.reduce((acc, curr) => acc + (parseInt(curr.s_count) || 0), 0);

            return (
                <div className="min-h-screen pb-12 font-sans">
                    {/* Header Header */}
                    <header className="bg-brand-900 text-white pt-10 pb-16 px-4 sm:px-6 lg:px-8 shadow-inner">
                        <div className="max-w-6xl mx-auto">
                            <div className="flex flex-col md:flex-row md:justify-between md:items-end">
                                <div>
                                    <h2 className="text-brand-100 font-semibold mb-1 text-sm tracking-wider">ADMISSION CONSULTING DB</h2>
                                    <h1 className="text-3xl md:text-4xl font-black tracking-tight">농어촌/기회균형 전형 분석</h1>
                                    <p className="mt-2 text-brand-100 font-medium opacity-90">주요 대학 인원 변동 및 특이사항 (전년 대비)</p>
                                </div>
                                
                                {/* Quick Stats */}
                                <div className="mt-6 md:mt-0 flex gap-4 bg-brand-800/50 p-4 rounded-xl border border-brand-700/50 backdrop-blur-sm">
                                    <div className="text-center">
                                        <p className="text-brand-200 text-xs font-bold mb-1">교과 총원</p>
                                        <p className="font-mono text-xl font-bold">{totalG.toLocaleString()}</p>
                                    </div>
                                    <div className="w-px bg-brand-700"></div>
                                    <div className="text-center">
                                        <p className="text-brand-200 text-xs font-bold mb-1">종합 총원</p>
                                        <p className="font-mono text-xl font-bold">{totalJ.toLocaleString()}</p>
                                    </div>
                                    <div className="w-px bg-brand-700"></div>
                                    <div className="text-center">
                                        <p className="text-brand-200 text-xs font-bold mb-1">정시 총원</p>
                                        <p className="font-mono text-xl font-bold">{totalS.toLocaleString()}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8 relative z-10">
                        
                        {/* Search & Filter Controls */}
                        <div className="bg-white rounded-2xl shadow-lg p-4 md:p-6 mb-8 flex flex-col md:flex-row gap-4 justify-between items-center border border-gray-100">
                            
                            <div className="relative w-full md:w-96">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <SearchIcon />
                                </div>
                                <input
                                    type="text"
                                    className="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-xl leading-5 bg-gray-50 placeholder-gray-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-colors sm:text-sm font-medium"
                                    placeholder="대학명 검색 (예: 서울대, 연세대)"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>

                            <div className="flex bg-gray-100 p-1 rounded-xl w-full md:w-auto overflow-x-auto">
                                {[
                                    { id: 'all', label: '전체보기' },
                                    { id: 'g', label: '교과 전형' },
                                    { id: 'j', label: '종합 전형' },
                                    { id: 's', label: '정시 전형' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setFilterType(tab.id)}
                                        className={`flex-1 md:flex-none px-4 py-2 text-sm font-bold rounded-lg whitespace-nowrap transition-all ${
                                            filterType === tab.id 
                                            ? 'bg-white text-brand-600 shadow-sm' 
                                            : 'text-gray-500 hover:text-gray-700 hover:bg-gray-200/50'
                                        }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Results Count */}
                        <div className="mb-4 text-sm text-gray-500 font-medium px-2">
                            검색 결과 <span className="font-bold text-brand-600">{filteredData.length}</span>개 대학
                        </div>

                        {/* List Grid */}
                        <div className="space-y-6">
                            {filteredData.map((item, index) => (
                                <div key={index} className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden fade-in">
                                    
                                    <div className="bg-gray-50/80 px-6 py-4 border-b border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                        <h3 className="text-xl font-black text-gray-900 tracking-tight">{item.univ}</h3>
                                        
                                        {item.note && (
                                            <div className="bg-blue-50 text-blue-700 text-sm px-3 py-2 rounded-lg font-medium flex items-start border border-blue-100 max-w-2xl">
                                                <div className="mt-0.5"><InfoIcon /></div>
                                                <span className="leading-tight">{item.note}</span>
                                            </div>
                                        )}
                                    </div>

                                    <div className="p-6">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {/* Render sections conditionally, or a placeholder if none exist but to keep layout */}
                                            {item.g_name || item.j_name || item.s_name ? (
                                                <>
                                                    <SectionBox title="교과전형" name={item.g_name} change={item.g_change} count={item.g_count} diff={item.g_diff} />
                                                    <SectionBox title="종합전형" name={item.j_name} change={item.j_change} count={item.j_count} diff={item.j_diff} />
                                                    <SectionBox title="정시" name={item.s_name} change={item.s_change} count={item.s_count} diff={item.s_diff} />
                                                </>
                                            ) : (
                                                <div className="col-span-3 text-center py-8 text-gray-400 font-medium">전형 데이터가 없습니다.</div>
                                            )}
                                            
                                            {/* Placeholder columns if some are missing to maintain grid visual (optional, but looks cleaner if they just align left) */}
                                            {/* Currently implemented to only show existing ones. To make them strictly 3 cols, wrap in divs conditionally. */}
                                            {/* Actually, SectionBox returns null if no name. Let's make it return an empty state box instead for better grid alignment */}
                                        </div>
                                    </div>
                                </div>
                            ))}

                            {filteredData.length === 0 && (
                                <div className="text-center py-20 bg-white rounded-2xl shadow-sm border border-gray-200">
                                    <svg className="mx-auto h-12 w-12 text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <h3 className="text-lg font-medium text-gray-900">검색 결과가 없습니다</h3>
                                    <p className="mt-1 text-sm text-gray-500">다른 대학명이나 필터 조건을 시도해 보세요.</p>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
